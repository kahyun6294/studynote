<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합소득세 신고 요약 안내</title>
    <style>
        :root {
            --primary-color: #2b4c7e;
            --table-th-bg: #f4f7fa;
            --border-color: #cfd8dc;
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Malgun Gothic', Dotum, sans-serif;
            line-height: 1.5;
            color: var(--text-color);
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px 10px;
        }
        .pdf-page {
            max-width: 840px;
            margin: 0 auto bg;
            background: #ffffff;
            padding: 50px 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        .header-tag {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        
        /* 기본 정보 테이블 */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 35px;
        }
        .info-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            font-size: 13px;
        }
        .info-table td.label {
            background-color: var(--table-th-bg);
            font-weight: bold;
            color: #34495e;
            width: 20%;
            text-align: center;
        }

        h2 {
            font-size: 15px;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
            margin-top: 30px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* 메인 데이터 테이블 */
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        table.data-table th, table.data-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            font-size: 13px;
        }
        table.data-table th {
            background-color: var(--table-th-bg);
            color: #34495e;
            font-weight: bold;
        }
        table.data-table td.category {
            background-color: #fafbfc;
            font-weight: bold;
            text-align: center;
        }

        /* 인풋 스타일 */
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: inherit;
        }
        input[type="number"] {
            text-align: right;
        }
        input.left {
            text-align: left;
        }
        input[readonly] {
            background-color: #edf2f7;
            border-color: var(--border-color);
            color: #4a5568;
        }

        /* 버튼 컨테이너 */
        .btn-space {
            margin-bottom: 8px;
        }
        button {
            background-color: #fff;
            border: 1px solid #cbd5e0;
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            color: #4a5568;
        }
        button:hover {
            background-color: #f7fafc;
        }
        button.delete-btn {
            color: #e53e3e;
            border-color: #fed7d7;
            background-color: #fff5f5;
        }
        button.delete-btn:hover {
            background-color: #fed7d7;
        }

        /* 세액계산 흐름 레이아웃 (좌측 기호 열) */
        .sign-col {
            width: 5%;
            font-weight: bold;
            font-size: 14px;
            color: #7f8c8d;
            background-color: #fafbfc;
            text-align: center;
        }

        /* 메모 및 하단 서명란 */
        .memo-box {
            width: 100%;
            height: 80px;
            resize: none;
            padding: 10px;
            font-size: 13px;
        }
        .footer-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        .footer-table td {
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 13px;
        }
        .footer-table td.label {
            background-color: var(--table-th-bg);
            font-weight: bold;
            text-align: center;
            width: 20%;
        }
    </style>
</head>
<body>

<div class="pdf-page">
    <div class="header-tag">INCOME TAX</div>
    <h1>종합소득세 신고 요약 서식</h1>
    <div class="subtitle">귀속연도 종합소득세 신고 내역 요약 및 제출 서류 안내</div>

    <table class="info-table">
        <tr>
            <td class="label">귀속연도</td>
            <td><input type="number" value="2025" style="text-align: left;"></td>
            <td class="label">신고 기한</td>
            <td><input type="text" class="left" value="2026년 5월 31일"></td>
        </tr>
        <tr>
            <td class="label">상호/성명</td>
            <td><input type="text" class="left" value="홍길동/(주)예시상사"></td>
            <td class="label">사업자 / 주민번호</td>
            <td><input type="text" class="left" value="123-45-67890"></td>
        </tr>
    </table>

            <tr>

                <th style="width: 20%;">업종코드</th>
                <th style="width: 30%;">수입금액(원)</th>
                <th style="width: 15%;">관리</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" class="left" placeholder="사업장명/상호 입력"></td>
                <td><input type="text" class="left" placeholder="업종코드 입력"></td>
                <td><input type="number" class="biz-income" value="0" oninput="updateBizTotal()"></td>
                <td style="text-align: center; color: #a0aec0;">-</td>
            </tr>
        </tbody>
        <tfoot>
            <tr style="background-color: #fafbfc; font-weight: bold;">
                <td colspan="2" style="text-align: center;">사업소득 수입금액 합계</td>
                <td><input type="number" id="totalBizIncome" value="0" readonly></td>
                <td></td>
            </tr>
        </tfoot>
    </table>

                <th style="width: 15%;">비고</th>
            </tr>

                <td><input type="text" class="left" value="금융기관 이자 등"></td>
                <td><input type="number" class="other-income" value="0" oninput="updateOtherTotal()"></td>
                <td><input type="text" class="left" placeholder="금융기관명 등"></td>
            </tr>
            <tr>
                <td class="category">배당소득</td>

                <td><input type="number" class="other-income" value="0" oninput="updateOtherTotal()"></td>
                <td><input type="text" class="left"></td>
            </tr>
            <tr>
                <td class="category">근로소득</td>
                <td><input type="text" class="left" value="급여 등"></td>

                <td><input type="text" class="left" placeholder="회사명 등"></td>

            <tr>
                <td class="category">연금소득</td>

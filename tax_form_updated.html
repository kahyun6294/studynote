<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종합소득세 신고 요약</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1a2744;
    --navy-light: #243255;
    --gold: #b8962e;
    --gold-light: #d4a93a;
    --bg: #faf8f3;
    --bg2: #f3f0e8;
    --border: #e0d9cc;
    --text: #1c1c1c;
    --muted: #7a7065;
    --red: #c0392b;
    --blue: #2563eb;
    --green: #16a34a;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #eee;
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
  }

  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--navy);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .toolbar-title { color: #fff; font-weight: 600; font-size: 14px; flex: 1; }
  .toolbar-btn {
    padding: 7px 16px; border: none; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .btn-print { background: var(--gold); color: #fff; }
  .btn-print:hover { background: var(--gold-light); }
  .btn-reset { background: #ffffff22; color: #fff; border: 1px solid #ffffff44; }
  .btn-reset:hover { background: #ffffff33; }

  .page-wrap {
    max-width: 820px;
    margin: 68px auto 40px;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,.15);
    padding: 40px 44px 48px;
  }

  .doc-header {
    border-bottom: 3px solid var(--navy);
    padding-bottom: 18px;
    margin-bottom: 24px;
  }
  .doc-header-top {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .doc-tag {
    background: var(--navy); color: #fff;
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    padding: 3px 10px; border-radius: 3px; margin-bottom: 6px;
    display: inline-block;
  }
  .doc-title {
    font-size: 22px; font-weight: 700; color: var(--navy);
    letter-spacing: -.02em;
  }
  .doc-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .doc-year-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 18px; text-align: center;
  }
  .doc-year-label { font-size: 11px; color: var(--muted); }
  .doc-year-val {
    font-size: 20px; font-weight: 700; color: var(--navy);
    outline: none; border: none; background: transparent;
    width: 80px; text-align: center;
    font-family: inherit;
  }

  .client-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 12px; margin-bottom: 24px;
  }
  .client-field { display: flex; flex-direction: column; gap: 3px; }
  .field-label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .field-input {
    border: none; border-bottom: 1.5px solid var(--border);
    padding: 5px 4px; font-family: inherit; font-size: 13px;
    color: var(--text); background: transparent; outline: none;
    transition: border-color .15s;
  }
  .field-input:focus { border-bottom-color: var(--navy); }
  .field-input::placeholder { color: #bbb; }

  .section { margin-bottom: 28px; }
  .section-header {
    display: flex; align-items: center; gap: 10px;
    background: var(--navy); color: #fff;
    padding: 9px 14px; border-radius: 6px 6px 0 0;
    margin-bottom: 0;
  }
  .section-num {
    background: var(--gold); color: #fff;
    font-size: 11px; font-weight: 700;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
  .section-body {
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 6px 6px; overflow: hidden;
  }

  .biz-table { width: 100%; border-collapse: collapse; }
  .biz-table th {
    background: var(--bg2); font-size: 11px; font-weight: 600;
    color: var(--muted); text-align: left;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .biz-table th.th-right { text-align: right; }
  .biz-table th.th-center { text-align: center; }
  .biz-table td { padding: 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .biz-table tr:last-child td { border-bottom: none; }
  .biz-table tr:hover td { background: var(--bg); }
  .biz-table .td-del { width: 38px; text-align: center; padding: 6px 4px; }
  .biz-table tfoot td { background: #f0ede5; font-weight: 700; padding: 8px 10px; border-top: 2px solid var(--border); }

  .income-table { width: 100%; border-collapse: collapse; }
  .income-table th {
    background: var(--bg2); font-size: 11px; font-weight: 600;
    color: var(--muted); text-align: left;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .income-table th:last-child { text-align: right; }
  .income-table td { padding: 0; border-bottom: 1px solid var(--border); }
  .income-table tr:last-child td { border-bottom: none; }
  .income-table tr:hover td { background: var(--bg); }
  .income-table .td-label {
    padding: 9px 12px; font-weight: 500; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .income-table .td-amount { text-align: right; padding-right: 4px; }
  .row-total td { background: #f0ede5 !important; font-weight: 700; }
  .row-total .amount-input { font-weight: 700; color: var(--navy); }

  .amount-input {
    text-align: right; border: none; background: transparent;
    font-family: inherit; font-size: 13px; color: var(--text);
    padding: 9px 10px 9px 4px; width: 100%; outline: none;
  }
  .amount-input:focus { background: #fffbf0; }
  .amount-input::placeholder { color: #ccc; font-size: 12px; }
  .amount-input.left { text-align: left; padding: 9px 10px; }
  .amount-input.center { text-align: center; padding: 9px 6px; }

  .type-badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 10px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-blue   { background: #dbeafe; color: #1d4ed8; }
  .badge-green  { background: #dcfce7; color: #15803d; }
  .badge-orange { background: #ffedd5; color: #c2410c; }
  .badge-purple { background: #ede9fe; color: #7c3aed; }
  .badge-gray   { background: #f1f5f9; color: #475569; }
  .badge-teal   { background: #ccfbf1; color: #0f766e; }
  .badge-rose   { background: #ffe4e6; color: #be123c; }

  .add-row-btn {
    font-size: 12px; color: var(--navy); background: var(--bg2);
    border: 1px dashed var(--border); border-radius: 4px;
    padding: 5px 14px; cursor: pointer; font-family: inherit;
    transition: all .1s; display: inline-flex; align-items: center; gap: 4px;
  }
  .add-row-btn:hover { background: var(--border); }
  .del-row-btn {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fee2e2; color: #dc2626; border: none;
    cursor: pointer; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; padding: 0; flex-shrink: 0;
    transition: background .1s;
  }
  .del-row-btn:hover { background: #fca5a5; }
  .add-row-wrap { padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg); }

  .deduct-table { width: 100%; border-collapse: collapse; }
  .deduct-table th {
    background: var(--bg2); font-size: 11px; font-weight: 600;
    color: var(--muted); padding: 8px 12px;
    border-bottom: 1px solid var(--border); text-align: left;
  }
  .deduct-table th:nth-child(2), .deduct-table th:nth-child(3) { text-align: right; }
  .deduct-table td {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .deduct-table tr:last-child td { border-bottom: none; }
  .deduct-table tr:hover td { background: var(--bg); }
  .deduct-table .td-amt { text-align: right; }
  .deduct-table .amount-input { padding: 2px 0; width: 130px; float: right; }
  .deduct-section-row td {
    background: var(--bg2); font-weight: 700; font-size: 12px;
    color: var(--navy); padding: 6px 12px;
    border-top: 1px solid var(--border);
  }

  .tax-calc { padding: 0; }
  .tax-row {
    display: grid; grid-template-columns: 28px 1fr auto;
    align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .tax-row:last-child { border-bottom: none; }
  .tax-row:hover { background: var(--bg); }
  .tax-operator {
    font-size: 16px; font-weight: 700; text-align: center;
    color: var(--muted);
  }
  .tax-label { font-size: 13px; }
  .tax-label small { font-size: 11px; color: var(--muted); display: block; }
  .tax-amount { text-align: right; min-width: 150px; }
  .tax-amount .amount-input { width: 150px; }
  .tax-row-result { background: #f0ede5 !important; }
  .tax-row-result .tax-label { font-weight: 700; color: var(--navy); }
  .tax-row-result .amount-input { font-weight: 700; color: var(--navy); font-size: 14px; }
  .tax-row-final { background: var(--navy) !important; }
  .tax-row-final .tax-operator,
  .tax-row-final .tax-label { color: #fff !important; font-weight: 700; }
  .tax-row-final .amount-input { color: var(--gold) !important; font-weight: 700; font-size: 15px; }
  .tax-row-final:hover { background: var(--navy-light) !important; }

  .progressive-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #eff6ff; border: 1px solid #bfdbfe;
    border-radius: 6px; padding: 4px 10px;
    font-size: 11px; color: #1d4ed8; font-weight: 600;
    white-space: nowrap;
  }
  .progressive-badge .rate-pct { font-size: 15px; font-weight: 700; color: var(--navy); }
  .progressive-badge .sep { color: #93c5fd; }
  .progressive-badge .deduction-amt { color: #dc2626; font-weight: 700; }

  .memo-box { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .memo-header {
    background: var(--bg2); padding: 8px 14px;
    font-size: 11px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .memo-textarea {
    width: 100%; min-height: 80px; padding: 12px 14px;
    border: none; font-family: inherit; font-size: 12.5px;
    color: var(--text); resize: vertical; outline: none;
    background: #fff; line-height: 1.6;
  }
  .memo-textarea::placeholder { color: #bbb; }

  .send-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; padding-top: 18px;
    border-top: 2px solid var(--navy);
    font-size: 12px;
  }
  .send-info { display: flex; flex-direction: column; gap: 4px; }
  .send-label { font-size: 11px; color: var(--muted); }
  .send-val { font-weight: 600; color: var(--navy); }
  .send-stamp {
    width: 70px; height: 70px; border-radius: 50%;
    border: 2px solid var(--navy); display: flex;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--navy);
    text-align: center; line-height: 1.4;
    cursor: pointer; transition: all .15s; outline: none;
  }
  .send-stamp:hover { background: var(--bg2); }
  .send-stamp[data-stamped="true"] { background: var(--navy); color: #fff; }

  .screen-page-break {
    border: none; border-top: 2px dashed #c0b8a8;
    margin: 8px 0 32px; position: relative;
  }
  .screen-page-break::after {
    content: '✂  2쪽';
    position: absolute; top: -10px; left: 50%;
    transform: translateX(-50%);
    background: #fff; padding: 0 10px;
    font-size: 11px; color: #c0b8a8; letter-spacing: .05em;
  }

  @media print {
    body { background: #fff; }
    .toolbar, .add-row-wrap, .del-row-btn, .screen-page-break { display: none !important; }
    .page-wrap { margin: 0; box-shadow: none; padding: 20px 24px 28px; }
    .field-input, .amount-input, .doc-year-val, .memo-textarea,
    .section-header, .row-total td, .tax-row-final,
    .doc-tag, .deduct-section-row td, .biz-table tfoot td, .progressive-badge {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .page-break-before { page-break-before: always; break-before: page; padding-top: 24px; }
    @page { size: A4; margin: 14mm 15mm 16mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">📋 종합소득세 신고 요약 서식</span>
  <button class="toolbar-btn btn-reset" onclick="resetAll()">초기화</button>
  <button class="toolbar-btn btn-print" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
</div>

<div class="page-wrap" id="mainDoc">

  <div class="doc-header">
    <div class="doc-header-top">
      <div>
        <div class="doc-tag">INCOME TAX</div>
        <div class="doc-title">종합소득세 신고 요약 서식</div>
        <div class="doc-subtitle">귀속연도 종합소득세 신고 내역 요약 및 제출 서류 안내</div>
      </div>
      <div class="doc-year-box">
        <div class="doc-year-label">귀속연도</div>
        <input class="doc-year-val" id="taxYear" type="text" value="2025" maxlength="4">
        <div class="doc-year-label" style="margin-top:2px;">년도</div>
      </div>
    </div>
  </div>

  <div class="client-row">
    <div class="client-field">
      <span class="field-label">성명</span>
      <input class="field-input" id="f_name" placeholder="홍길동 대표님">
    </div>
    <div class="client-field">
      <span class="field-label">납부기한</span>
      <input class="field-input" id="f_deadline" placeholder="2026년 6월 1일">
    </div>
  </div>

  <!-- ① 사업장별 수입금액 -->
  <div class="section">
    <div class="section-header">
      <div class="section-num">1</div>
      <span class="section-title">사업장별 수입금액 <span style="font-size:11px;font-weight:400;opacity:.8">(사업소득)</span></span>
    </div>
    <div class="section-body">
      <table class="biz-table">
        <thead>
          <tr>
            <th style="width:38px;text-align:center"></th>
            <th style="width:28%">사업장명 / 상호</th>
            <th style="width:12%;text-align:center">업종코드</th>
            <th style="width:20%;text-align:right">수입금액 (원)</th>
            <th style="width:20%;text-align:right">필요경비 (원)</th>
            <th style="width:20%;text-align:right">소득금액 (원)</th>
          </tr>
        </thead>
        <tbody id="bizRows"></tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="color:var(--navy);font-weight:700;font-size:13px;">합계</td>
            <td style="text-align:right;"><input class="amount-input" id="totalBizIncome" placeholder="0" readonly style="cursor:default;font-weight:700;color:var(--navy);"></td>
            <td style="text-align:right;"><input class="amount-input" id="totalBizExpense" placeholder="0" readonly style="cursor:default;font-weight:700;color:var(--navy);"></td>
            <td style="text-align:right;"><input class="amount-input" id="totalBizNet" placeholder="0" readonly style="cursor:default;font-weight:700;color:var(--navy);"></td>
          </tr>
        </tfoot>
      </table>
      <div class="add-row-wrap">
        <button class="add-row-btn" onclick="addBizRow()">＋ 사업장 추가</button>
      </div>
    </div>
  </div>

  <!-- ② 타소득 합산 -->
  <div class="section">
    <div class="s

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종합소득세 신고 요약</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1a2744; --navy-light: #243255; --gold: #b8962e; --gold-light: #d4a93a;
    --bg: #faf8f3; --bg2: #f3f0e8; --border: #e0d9cc; --text: #1c1c1c; --muted: #7a7065;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: #eee; color: var(--text); font-size: 13px; line-height: 1.6; }
  .toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--navy); display: flex; align-items: center; gap: 8px; padding: 10px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .toolbar-title { color: #fff; font-weight: 600; font-size: 14px; flex: 1; }
  .toolbar-btn { padding: 7px 14px; border: none; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .btn-print { background: var(--gold); color: #fff; }
  .btn-print:hover { background: var(--gold-light); }
  .btn-reset { background: #ffffff22; color: #fff; border: 1px solid #ffffff44; }
  .btn-reset:hover { background: #ffffff33; }
  .btn-pdf { background: #7c3aed; color: #fff; }
  .btn-pdf:hover { background: #6d28d9; }
  .page-wrap { max-width: 820px; margin: 68px auto 40px; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.15); padding: 40px 44px 48px; }
  .doc-header { border-bottom: 3px solid var(--navy); padding-bottom: 18px; margin-bottom: 24px; }
  .doc-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .doc-tag { background: var(--navy); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .05em; padding: 3px 10px; border-radius: 3px; margin-bottom: 6px; display: inline-block; }
  .doc-title { font-size: 22px; font-weight: 700; color: var(--navy); letter-spacing: -.02em; }
  .doc-year-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; text-align: center; }
  .doc-year-label { font-size: 11px; color: var(--muted); }
  .doc-year-val { font-size: 20px; font-weight: 700; color: var(--navy); outline: none; border: none; background: transparent; width: 80px; text-align: center; font-family: inherit; }
  .client-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .client-field { display: flex; flex-direction: column; gap: 3px; }
  .field-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field-input { border: none; border-bottom: 1.5px solid var(--border); padding: 5px 4px; font-family: inherit; font-size: 13px; color: var(--text); background: transparent; outline: none; transition: border-color .15s; }
  .field-input:focus { border-bottom-color: var(--navy); }
  .section { margin-bottom: 28px; }
  .section-header { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 6px 6px 0 0; }
  .section-num { background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
  .section-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; overflow: hidden; }
  .biz-table { width: 100%; border-collapse: collapse; }
  .biz-table th { background: var(--bg2); font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .biz-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .biz-table tr:last-child td { border-bottom: none; }
  .biz-table tfoot td { background: #f0ede5; font-weight: 700; padding: 8px 10px; border-top: 2px solid var(--border); }
  .amount-input { text-align: right; border: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); padding: 5px 0; width: 100%; outline: none; }
  .amount-input.left { text-align: left; }
  .amount-input.center { text-align: center; }
  .tax-calc { padding: 0; }
  .tax-row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .tax-row:last-child { border-bottom: none; }
  .tax-operator { font-size: 16px; font-weight: 700; text-align: center; color: var(--muted); }
  .tax-label { font-size: 13px; }
  .tax-label small { font-size: 11px; color: var(--muted); display: block; }
  .tax-amount { text-align: right; min-width: 150px; }
  .tax-amount .amount-input { width: 150px; }
  .tax-row-result { background: #f0ede5 !important; }
  .tax-row-result .tax-label { font-weight: 700; color: var(--navy); }
  .tax-row-result .amount-input { font-weight: 700; color: var(--navy); font-size: 14px; }
  .tax-row-final { background: var(--navy) !important; }
  .tax-row-final .tax-operator, .tax-row-final .tax-label { color: #fff !important; font-weight: 700; }
  .tax-row-final .amount-input { color: var(--gold) !important; font-weight: 700; font-size: 15px; }
  .add-row-wrap { padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg); }
  .add-row-btn { font-size: 12px; color: var(--navy); background: var(--bg2); border: 1px dashed var(--border); border-radius: 4px; padding: 5px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .del-row-btn { width: 22px; height: 22px; border-radius: 50%; background: #fee2e2; color: #dc2626; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
  .overlay.show { display:flex; }
  .overlay-box { background:#fff; border-radius:12px; padding:32px 40px; text-align:center; }
  .overlay-spinner { width:40px; height:40px; border:4px solid #e0d9cc; border-top-color:var(--navy); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div class="overlay" id="loadingOverlay">
  <div class="overlay-box">
    <div class="overlay-spinner"></div>
    <div style="font-size:14px; font-weight:600; color:var(--navy);">위하고 PDF 분석 중...</div>
  </div>
</div>

<div class="toolbar">
  <span class="toolbar-title">📋 종합소득세 신고 요약</span>
  <button class="toolbar-btn btn-pdf" onclick="document.getElementById('pdfInput').click()">📄 위하고 PDF 불러오기</button>
  <input type="file" id="pdfInput" accept=".pdf" style="display:none" onchange="uploadPDF(event)">
  <div style="width: 1px; height: 24px; background: #ffffff33;"></div>
  <button class="toolbar-btn btn-reset" onclick="resetAll()">초기화</button>
  <button class="toolbar-btn btn-print" onclick="window.print()">🖨 인쇄 / PDF 출력</button>
</div>

<div class="page-wrap">
  <div class="doc-header">
    <div class="doc-header-top">
      <div>
        <div class="doc-tag">INCOME TAX</div>
        <div class="doc-title">종합소득세 신고 요약</div>
      </div>
      <div class="doc-year-box">
        <div class="doc-year-label">귀속연도</div>
        <input class="doc-year-val" id="taxYear" type="text" value="2025" maxlength="4">
        <div class="doc-year-label" style="margin-top:2px;">년도</div>
      </div>
    </div>
  </div>

  <div class="client-row">
    <div class="client-field">
      <span class="field-label">성명</span>
      <input class="field-input" id="f_name" placeholder="고객 성명">
    </div>
    <div class="client-field">
      <span class="field-label">납부기한</span>
      <input class="field-input" id="f_deadline" value="2026년 06월 01일">
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-num">1</div>
      <span class="section-title">사업장별 수입금액 및 소득금액</span>
    </div>
    <div class="section-body">
      <table class="biz-table">
        <thead>
          <tr>
            <th style="width:50px; text-align:center;">삭제</th>
            <th style="width:25%">상호 (사업장명)</th>
            <th style="width:20%; text-align:center">사업자번호</th>
            <th style="width:18%; text-align:right">총수입금액 (원)</th>
            <th style="width:18%; text-align:right">필요경비 (원)</th>
            <th style="width:19%; text-align:right">소득금액 (원)</th>
          </tr>
        </thead>
        <tbody id="bizRows"></tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="color:var(--navy); font-weight:700;">사업소득 합계</td>
            <td style="text-align:right;"><input class="amount-input" id="totalBizIncome" readonly style="font-weight:700; color:var(--navy);"></td>
            <td style="text-align:right;"><input class="amount-input" id="totalBizExpense" readonly style="font-weight:700; color:var(--navy);"></td>
            <td style="text-align:right;"><input class="amount-input" id="totalBizNet" readonly style="font-weight:700; color:var(--navy);"></td>
          </tr>
        </tfoot>
      </table>
      <div class="add-row-wrap">
        <button class="add-row-btn" onclick="addBizRow('', '', 0, 0, 0)">＋ 사업장 추가</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-num">2</div>
      <span class="section-title">세액 계산 명세</span>
    </div>
    <div class="section-body tax-calc">
      <div class="tax-row">
        <div class="tax-operator"></div>
        <div class="tax-label">종합소득금액 <small>사업소득 + 타소득 합산 금액</small></div>
        <div class="tax-amount"><input class="amount-input" id="tc_total_income" placeholder="0" oninput="handleAmtInput(this)"></div>
      </div>
      <div class="tax-row">
        <div class="tax-operator">－</div>
        <div class="tax-label">소득공제 종합합계 <small>인적공제, 연금보험료 등 공제액</small></div>
        <div class="tax-amount"><input class="amount-input" id="tc_deduction" placeholder="0" oninput="handleAmtInput(this)"></div>
      </div>
      <div class="tax-row tax-row-result">
        <div class="tax-operator">＝</div>
        <div class="tax-label">과세표준</div>
        <div class="tax-amount"><input class="amount-input" id="tc_tax_base" readonly placeholder="0"></div>
      </div>
      <div class="tax-row">
        <div class="tax-operator">×</div>
        <div class="tax-label">세율 (%)</div>
        <div class="tax-amount"><input class="amount-input center" id="tc_rate" placeholder="—" style="width:80px; text-align:center;"></div>
      </div>
      <div class="tax-row tax-row-result">
        <div class="tax-operator">＝</div>
        <div class="tax-label">산출세액</div>
        <div class="tax-amount"><input class="amount-input" id="tc_calc_amt" placeholder="0" oninput="handleAmtInput(this)"></div>
      </div>
      <div class="tax-row">
        <div class="tax-operator">－</div>
        <div class="tax-label">세액공제 및 감면 <small>전자신고공제 등 공제합계</small></div>
        <div class="tax-amount"><input class="amount-input" id="tc_credit" placeholder="0" oninput="handleAmtInput(this)"></div>
      </div>
      <div class="tax-row tax-row-final">
        <div class="tax-operator">＝</div>
        <div class="tax-label" id="finalLabel">결정세액 (납부)</div>
        <div class="tax-amount"><input class="amount-input" id="tc_final" readonly placeholder="0"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function fmtNum(num) {
    if (isNaN(num)) return "0";
    return num.toLocaleString('ko-KR');
  }

  function parseNum(str) {
    if (!str) return 0;
    return parseInt(str.toString().replace(/[^0-9-]/g, '')) || 0;
  }

  function handleAmtInput(el) {
    let val = parseNum(el.value);
    el.value = fmtNum(val);
    calcAll();
  }

  function addBizRow(name='', bno='', inc=0, exp=0, net=0) {
    const tbody = document.getElementById('bizRows');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align:center;"><button class="del-row-btn" onclick="this.closest('tr').remove(); calcAll();">×</button></td>
      <td><input class="amount-input left" value="${name}" placeholder="사업장명"></td>
      <td><input class="amount-input center" value="${bno}" placeholder="000-00-00000"></td>
      <td><input class="amount-input biz-inc" value="${fmtNum(inc)}" oninput="handleAmtInput(this)"></td>
      <td><input class="amount-input biz-exp" value="${fmtNum(exp)}" oninput="handleAmtInput(this)"></td>
      <td><input class="amount-input biz-net" value="${fmtNum(net)}" oninput="handleAmtInput(this)"></td>
    `;
    tbody.appendChild(tr);
    calcAll();
  }

  function calcAll() {
    let tInc = 0, tExp = 0, tNet = 0;
    
    document.querySelectorAll('#bizRows tr').forEach(tr => {
      let inc = parseNum(tr.querySelector('.biz-inc').value);
      let exp = parseNum(tr.querySelector('.biz-exp').value);
      let net = inc - exp;
      tr.querySelector('.biz-net').value = fmtNum(net);
      
      tInc += inc; tExp += exp; tNet += net;
    });

    document.getElementById('totalBizIncome').value = fmtNum(tInc);
    document.getElementById('totalBizExpense').value = fmtNum(tExp);
    document.getElementById('totalBizNet').value = fmtNum(tNet);

    let totalIncome = parseNum(document.getElementById('tc_total_income').value);
    let deduction = parseNum(document.getElementById('tc_deduction').value);
    let taxBase = Math.max(0, totalIncome - deduction);
    document.getElementById('tc_tax_base').value = fmtNum(taxBase);

    let calcAmt = parseNum(document.getElementById('tc_calc_amt').value);
    let credit = parseNum(document.getElementById('tc_credit').value);
    let finalTax = calcAmt - credit;

    const labelEl = document.getElementById('finalLabel');
    if (finalTax < 0) {
      labelEl.innerText = "결정세액 (환급)";
      labelEl.style.color = "#86efac";
    } else {
      labelEl.innerText = "결정세액 (납부)";
      labelEl.style.color = "#fff";
    }
    document.getElementById('tc_final').value = fmtNum(finalTax);
  }

  function resetAll() {
    document.getElementById('f_name').value = '';
    document.getElementById('bizRows').innerHTML = '';
    document.getElementById('tc_total_income').value = '';
    document.getElementById('tc_deduction').value = '';
    document.getElementById('tc_tax_base').value = '';
    document.getElementById('tc_rate').value = '';
    document.getElementById('tc_calc_amt').value = '';
    document.getElementById('tc_credit').value = '';
    document.getElementById('tc_final').value = '';
    calcAll();
  }

  async function uploadPDF(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('loadingOverlay').classList.add('show');
    
    try {
      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        let fullText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join("\n");
          fullText += `\n--- PAGE ${i} ---\n` + pageText;
        }

        parseWehagoData(fullText);
        document.getElementById('loadingOverlay').classList.remove('show');
        alert("위하고 PDF 데이터 분석 완료!");
      };
      fileReader.readAsArrayBuffer(file);
    } catch (error) {
      console.error(error);
      document.getElementById('loadingOverlay').classList.remove('show');
      alert("PDF 분석 오류 발생");
    }
  }

  function parseWehagoData(text) {
    // 1. 성명 추출
    let nameMatch = text.match(/1성\s*?\n?\s*명([가-힣\s]+)\n/);
    if (!nameMatch) nameMatch = text.match(/신고인\s*?\n?\s*([가-힣]+)/);
    if (nameMatch) document.getElementById('f_name').value = nameMatch[1].replace(/\s/g, '').trim();

    // 2. 귀속연도 및 기한
    let yearMatch = text.match(/\((\d{4})년\s*귀속\)/);
    if (yearMatch) document.getElementById('taxYear').value = yearMatch[1];
    let dateMatch = text.match(/(\d{4})\s*년\s*(\d{2})\s*월\s*(\d{2})\s*일\s*?\n?\s*신고인/);
    if (dateMatch) document.getElementById('f_deadline').value = `${dateMatch[1]}년 ${dateMatch[2]}월 ${dateMatch[3]}일`;

    // 3. 사업소득명세서 정밀 파싱 로직
    document.getElementById('bizRows').innerHTML = ''; 
    let bizSection = text.split("● 사업소득명세서")[1];
    if (bizSection) {
      let nextSectionIdx = bizSection.search(/●/);
      if (nextSectionIdx !== -1) bizSection = bizSection.substring(0, nextSectionIdx);

      let lines = bizSection.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      
      // 텍스트 내에서 모든 사업자등록번호의 인덱스(위치)를 찾습니다.
      let bnoPositions = [];
      for(let i=0; i<lines.length; i++) {
        if(/^\d{3}-\d{2}-\d{5}$/.test(lines[i])) {
          bnoPositions.push(i);
        }
      }

      // 각 사업자번호 기준으로 데이터 구조 추적
      bnoPositions.forEach(idx => {
        let bno = lines[idx];
        let name = "사업장";
        let revenue = 0, expense = 0, netIncome = 0;

        // 상호 찾기 (사업자번호 바로 직전 혹은 전전 줄 탐색)
        if(idx > 0 && !/^[\d,]+$/.test(lines[idx-1]) && !lines[idx-1].includes('소득')) {
          name = lines[idx-1].split('(')[0];
        } else if(idx > 1 && !/^[\d,]+$/.test(lines[idx-2]) && !lines[idx-2].includes('소득')) {
          name = lines[idx-2].split('(')[0];
        }

        // 해당 사업자번호 이후에 등장하는 숫자 그룹(수입, 경비, 소득금액) 추적
        let numTokens = [];
        for(let j = idx + 1; j < lines.length; j++) {
          // 다음 사업자번호나 소득구분이 나오면 탐색 중단
          if(/^\d{3}-\d{2}-\d{5}$/.test(lines[j]) || lines[j].includes('소득구분')) break;
          if(/^[\d,]+$/.test(lines[j])) {
            numTokens.push(parseNum(lines[j]));
          }
        }

        // 위하고 배열 정렬 규칙 매칭 (수입금액, 필요경비, 소득금액 순서 매칭 보정)
        if(numTokens.length >= 3) {
          revenue = numTokens[0];
          expense = numTokens[1];
          netIncome = numTokens[2];
          
          // 만약 수입-경비 연산과 소득금액이 불일치하는 뒤집힘 현상 방어
          if(revenue - expense !== netIncome && numTokens.length >= 4) {
             // 텍스트가 밀려 스왑된 경우 교정
             if(numTokens[1] - numTokens[2] === numTokens[3]) {
                revenue = numTokens[1];
                expense = numTokens[2];
                netIncome = numTokens[3];
             }
          }
        } else if(numTokens.length === 2) {
          revenue = numTokens[0];
          netIncome = numTokens[1];
          expense = revenue - netIncome;
        }

        if(bno) {
          addBizRow(name, bno, revenue, expense, netIncome);
        }
      });
    }

    // 4. 세액의 계산 파싱 처리
    let calcSection = text.split("● 세액의 계산")[1];
    if (calcSection) {
      let tokens = calcSection.split('\n').map(t => t.replace(/["\s]/g, '').trim()).filter(t => t.length > 0);
      
      for(let i=0; i<tokens.length; i++) {
        if(tokens[i].includes("합소득액종금") || tokens[i].includes("종합소득금액")) {
          let val = findNextNumToken(tokens, i);
          if(val > 0) document.getElementById('tc_total_income').value = fmtNum(val);
        }
        if(tokens[i].includes("제소공득") || tokens[i].includes("소득공제")) {
          let val = findNextNumToken(tokens, i);
          if(val > 0) document.getElementById('tc_deduction').value = fmtNum(val);
        }
        if(tokens[i].includes("산세액출") || tokens[i].includes("산출세액")) {
          let val = findNextNumToken(tokens, i);
          if(val > 0) document.getElementById('tc_calc_amt').value = fmtNum(val);
        }
        if(tokens[i].includes("세제액공") || tokens[i].includes("세액공제")) {
          let val = findNextNumToken(tokens, i);
          if(val > 0) document.getElementById('tc_credit').value = fmtNum(val);
        }
        if(tokens[i].includes("세율")) {
          for(let j=i+1; j<i+5; j++) {
            if(tokens[j] && tokens[j].includes('%')) {
              document.getElementById('tc_rate').value = tokens[j];
              break;
            }
          }
        }
      }
    }
    calcAll();
  }

  function findNextNumToken(tokens, startIdx) {
    for(let j = startIdx + 1; j < startIdx + 6; j++) {
      if(tokens[j] && /^[\d,.]+$/.test(tokens[j]) && !tokens[j].includes('%')) {
        return parseNum(tokens[j].split('.')[0]);
      }
    }
    return 0;
  }
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합소득세 신고 요약 (WEHAGO PDF 자동 분석)</title>
    <!-- PDF.js 라이브러리 로드 (PDF 분석용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background: #f5f6f7; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #111; margin-bottom: 30px; }
        .action-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; background: #eaeaea; padding: 15px; border-radius: 5px; }
        .action-bar input[type="file"] { display: none; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-upload { background: #007bff; color: white; }
        .btn-save { background: #28a745; color: white; }
        .btn-print { background: #17a2b8; color: white; }
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .info-group { display: flex; flex-direction: column; }
        .info-group label { font-size: 12px; color: #666; margin-bottom: 5px; font-weight: bold; }
        .info-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #f8f9fa; font-weight: bold; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .btn-add { background: #6c757d; color: white; padding: 5px 10px; font-size: 12px; margin-bottom: 10px; }
        .summary-box { background: #f9f9f9; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .summary-row.total { border-bottom: none; font-weight: bold; font-size: 16px; color: #d9534f; padding-top: 15px; }
        .status-msg { font-size: 13px; color: #555; align-self: center; font-style: italic; }
        @media print {
            body { background: white; margin: 0; }
            .action-bar, .btn-add { display: none !important; }
            .container { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>종합소득세 신고 결과 요약 안내</h2>
    
    <!-- 기능 버튼 바 -->
    <div class="action-bar">
        <div>
            <label for="pdfFile" class="btn btn-upload">📄 위하고 PDF 불러오기</label>
            <input type="file" id="pdfFile" accept=".pdf" onchange="processPdf(event)">
            <button class="btn btn-save" onclick="saveToLocal()">💾 데이터 저장</button>
        </div>
        <div class="status-msg" id="statusMsg">데이터를 입력하거나 PDF를 업로드하세요.</div>
        <button class="btn btn-print" onclick="window.print()">🖨️ 요약본 인쇄 / PDF 출력</button>
    </div>

    <!-- 기본 정보 -->
    <div class="info-grid">
        <div class="info-group">
            <label>귀속 연도</label>
            <input type="text" id="taxYear" placeholder="예: 2025">
        </div>
        <div class="info-group">
            <label>상호 / 성명 (고객명)</label>
            <input type="text" id="taxpayerName" placeholder="홍길동">
        </div>
        <div class="info-group">
            <label>신고(납부) 기한</label>
            <input type="text" id="dueDate" value="2026. 06. 02">
        </div>
    </div>

    <!-- 사업장별 내역 -->
    <h3>1. 사업장별 수입금액 및 소득금액 명세</h3>
    <button class="btn btn-add" onclick="addBusinessRow()">＋ 사업장 추가</button>
    <table>
        <thead>
            <tr>
                <th>상호(사업장)</th>
                <th>사업자등록번호</th>
                <th>총수입금액(매출)</th>
                <th>필요경비</th>
                <th>소득금액</th>
            </tr>
        </thead>
        <tbody id="businessBody">
            <!-- 행이 동적으로 추가됩니다 -->
        </tbody>
    </table>

    <!-- 세액 계산 요약 -->
    <h3>2. 종합소득세 산출 명세 요약</h3>
    <div class="summary-box">
        <div class="summary-row">
            <span>① 종합소득금액 (사업소득 + 타소득)</span>
            <input type="text" id="totalIncomeAmt" class="text-right" value="0" oninput="calculateTax()">
        </div>
        <div class="summary-row">
            <span>② 소득공제 합계 (인적공제 등)</span>
            <input type="text" id="taxDeduction" class="text-right" value="0" oninput="calculateTax()">
        </div>
        <div class="summary-row" style="background: #f1f3f5; font-weight: bold;">
            <span>③ 과세표준 (① - ②)</span>
            <span id="taxBase">0</span>
        </div>
        <div class="summary-row">
            <span>④ 세율 (%)</span>
            <span id="taxRate">0%</span>
        </div>
        <div class="summary-row">
            <span>⑤ 산출세액 (③ × ④ - 누진공제)</span>
            <span id="calculatedTax">0</span>
        </div>
        <div class="summary-row">
            <span>⑥ 세액공제 및 감면 합계</span>
            <input type="text" id="taxCredit" class="text-right" value="0" oninput="calculateTax()">
        </div>
        <div class="summary-row total">
            <span>⑦ 최종 납부(환급)할 세액 (⑤ - ⑥)</span>
            <span id="finalTax">0 원</span>
        </div>
    </div>
</div>

<script>
    // PDF.js 워커 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    // 화면 시작 시 기존에 저장된 데이터가 있으면 불러옴 (대리님 요청 반영!)
    window.onload = function() {
        loadFromLocal();
        if(document.getElementById('businessBody').children.length === 0) {
            addBusinessRow(); // 기본 한 행 추가
        }
    };

    // 사업장 테이블 행 추가
    function addBusinessRow(name='', num='', income='0', expense='0', net='0') {
        const tbody = document.getElementById('businessBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" value="${name}" style="width:90%;"></td>
            <td><input type="text" value="${num}" style="width:90%;"></td>
            <td><input type="text" class="text-right b-income" value="${formatNum(income)}" oninput="updateRowCalc(this)" style="width:90%;"></td>
            <td><input type="text" class="text-right b-expense" value="${formatNum(expense)}" oninput="updateRowCalc(this)" style="width:90%;"></td>
            <td><input type="text" class="text-right b-net" value="${formatNum(net)}" readonly style="width:90%; background:#f5f5f5;"></td>
        `;
        tbody.appendChild(tr);
    }

    // 숫자 콤마 포맷팅
    function formatNum(val) {
        val = String(val).replace(/[^0-9-]/g, '');
        if(!val) return '0';
        return Number(val).toLocaleString();
    }
    function parseNum(val) {
        return Number(String(val).replace(/,/g, '')) || 0;
    }

    function updateRowCalc(input) {
        input.value = formatNum(input.value);
        const tr = input.closest('tr');
        const income = parseNum(tr.querySelector('.b-income').value);
        const expense = parseNum(tr.querySelector('.b-expense').value);
        tr.querySelector('.b-net').value = formatNum(income - expense);
        
        // 사업소득 합계를 종합소득금액에 자동 반영
        updateTotalIncomeFromTable();
    }

    function updateTotalIncomeFromTable() {
        let sum = 0;
        document.querySelectorAll('.b-net').forEach(el => {
            sum += parseNum(el.value);
        });
        document.getElementById('totalIncomeAmt').value = formatNum(sum);
        calculateTax();
    }

    // 종합소득세 세율 및 세액 산정 로직 (실제 세율표 반영)
    function calculateTax() {
        const totalIncome = parseNum(document.getElementById('totalIncomeAmt').value);
        const deduction = parseNum(document.getElementById('taxDeduction').value);
        
        let base = totalIncome - deduction;
        if (base < 0) base = 0;
        document.getElementById('taxBase').innerText = formatNum(base);

        let rate = 6;
        let cumDeduction = 0;

        // 과세표준 구간별 세율 계산
        if (base <= 14000000) { rate = 6; cumDeduction = 0; }
        else if (base <= 50000000) { rate = 15; cumDeduction = 1260000; }
        else if (base <= 88000000) { rate = 24; cumDeduction = 5760000; }
        else if (base <= 150000000) { rate = 35; cumDeduction = 15440000; }
        else if (base <= 300000000) { rate = 38; cumDeduction = 19940000; }
        else if (base <= 500000000) { rate = 40; cumDeduction = 25940000; }
        else if (base <= 1000000000) { rate = 42; cumDeduction = 35940000; }
        else { rate = 45; cumDeduction = 65940000; }

        document.getElementById('taxRate').innerText = rate + '%';
        
        let calcTax = Math.floor(base * (rate / 100) - cumDeduction);
        if (calcTax < 0) calcTax = 0;
        document.getElementById('calculatedTax').innerText = formatNum(calcTax);

        const credit = parseNum(document.getElementById('taxCredit').value);
        let final = calcTax - credit;
        
        document.getElementById('finalTax').innerText = formatNum(final) + ' 원';
    }

    // 로컬 스토리지에 데이터 안전하게 저장 기능
    function saveToLocal() {
        const data = {
            taxYear: document.getElementById('taxYear').value,
            taxpayerName: document.getElementById('taxpayerName').value,
            dueDate: document.getElementById('dueDate').value,
            totalIncomeAmt: document.getElementById('totalIncomeAmt').value,
            taxDeduction: document.getElementById('taxDeduction').value,
            taxCredit: document.getElementById('taxCredit').value,
            businesses: []
        };

        const rows = document.getElementById('businessBody').children;
        for(let tr of rows) {
            const inputs = tr.querySelectorAll('input');
            if(inputs.length >= 5) {
                data.businesses.push({
                    name: inputs[0].value,
                    num: inputs[1].value,
                    income: inputs[2].value,
                    expense: inputs[3].value,
                    net: inputs[4].value
                });
            }
        }

        localStorage.setItem('tax_summary_data', JSON.stringify(data));
        document.getElementById('statusMsg').innerText = "장부에 성공적으로 저장되었습니다!";
        alert("현재 입력된 내역이 브라우저에 임시 저장되었습니다.");
    }

    // 로컬 스토리지에서 데이터 불러오기
    function loadFromLocal() {
        const saved = localStorage.getItem('tax_summary_data');
        if(!saved) return;
        
        const data = JSON.parse(saved);
        document.getElementById('taxYear').value = data.taxYear || '';
        document.getElementById('taxpayerName').value = data.taxpayerName || '';
        document.getElementById('dueDate').value = data.dueDate || '';
        document.getElementById('totalIncomeAmt').value = data.totalIncomeAmt || '0';
        document.getElementById('taxDeduction').value = data.taxDeduction || '0';
        document.getElementById('taxCredit').value = data.taxCredit || '0';

        const tbody = document.getElementById('businessBody');
        tbody.innerHTML = '';
        if(data.businesses && data.businesses.length > 0) {
            data.businesses.forEach(b => {
                addBusinessRow(b.name, b.num, b.income, b.expense, b.net);
            });
        }
        calculateTax();
        document.getElementById('statusMsg').innerText = "이전 저장 데이터를 복구했습니다.";
    }

    // 🔥 핵심: 진짜 WEHAGO PDF 텍스트 파싱 로직
    async function processPdf(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('statusMsg').innerText = "PDF 파일 텍스트 분석 중...";
        
        const fileReader = new FileReader();
        fileReader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            try {
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                
                // PDF 전체 페이지 텍스트 긁어모으기
                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }
                
                // 추출된 텍스트 기반으로 위하고 서식의 키워드 매핑 매칭
                parseWehagoText(fullText);
                
            } catch (error) {
                console.error(error);
                alert("PDF 파일에서 텍스트를 추출하는 데 실패했습니다. 스캔본이 아닌 위하고 전자출력 파일인지 확인해 주세요.");
                document.getElementById('statusMsg').innerText = "분석 오류 발생.";
            }
        };
        fileReader.readAsArrayBuffer(file);
    }

    // 위하고 특유의 텍스트 패턴 정규식으로 분석
    function parseWehagoText(text) {
        console.log("추출된 원본 텍스트 요약: ", text.substring(0, 1000)); // 디버깅용
        
        // 1. 성명/고객명 매칭 패턴 (종합소득세 신고서 서식 기준)
        const nameMatch = text.match(/성\s*명\s*[:\s]([가-힣\s]{2,5})\s/);
        if(nameMatch) document.getElementById('taxpayerName').value = nameMatch[1].trim();

        // 2. 귀속연도 찾기
        const yearMatch = text.match(/(202\d)년\s*귀속/);
        if(yearMatch) document.getElementById('taxYear').value = yearMatch[1];

        // 3. 수입금액 및 세액 수치 추출 (위하고 소득세신고서 내 주요 항목명 기준)
        // 정규식 설명: 항목명 뒤에 나오는 숫자 배열 중 정수값을 타겟팅
        const incomeMatch = text.match(/총\s*수\s*입\s*금\s*액[\s\S]*?([\d,]+)/);
        const netIncomeMatch = text.match(/소\s*득\s*금\s*액[\s\S]*?([\d,]+)/);
        const deductionMatch = text.match(/소\s*득\s*공\s*제\s*합\s*계[\s\S]*?([\d,]+)/);
        const creditMatch = text.match(/세\s*액\s*공\s*제\s*합\s*계[\s\S]*?([\d,]+)/);

        // 테이블 리셋 후 파싱 데이터 주입
        const tbody = document.getElementById('businessBody');
        tbody.innerHTML = '';

        let parsedIncome = incomeMatch ? incomeMatch[1] : "0";
        let parsedNet = netIncomeMatch ? netIncomeMatch[1] : "0";
        let parsedExpense = formatNum(parseNum(parsedIncome) - parseNum(parsedNet));

        // 위하고 파일에서 상호나 사업자번호 유추 시도
        const bizNameMatch = text.match(/상\s*호\s*[:\s]([가-힣a-zA-Z0-9\s]+?)\s/);
        const bizNumMatch = text.match(/사업자\s*등록\s*번호\s*[:\s]([0-9-]{10,12})/);
        
        let bizName = bizNameMatch ? bizNameMatch[1].trim() : "주요 사업장";
        let bizNum = bizNumMatch ? bizNumMatch[1] : "";

        // 테이블 채우기
        addBusinessRow(bizName, bizNum, parsedIncome, parsedExpense, parsedNet);

        // 세액 요약칸 채우기
        if(deductionMatch) document.getElementById('taxDeduction').value = formatNum(deductionMatch[1]);
        if(creditMatch) document.getElementById('taxCredit').value = formatNum(creditMatch[1]);

        updateTotalIncomeFromTable();
        
        document.getElementById('statusMsg').innerText = "PDF 데이터가 자동으로 채워졌습니다! 오타가 없는지 확인해 보세요.";
        alert("위하고 PDF 분석 완료! 완벽하지 않은 항목은 직접 보완해 주세요.");
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합소득세 신고 내역 요약</title>
    <style>
        /* 원래 쓰시던 눈이 편안한 미니멀 그린 & 화이트 스타일 */
        :root {
            --primary-color: #2e7d32;     /* 메인 포인트 딥그린 */
            --primary-light: #e8f5e9;    /* 연한 그린 배경 */
            --text-color: #333333;       /* 깔끔한 먹색 텍스트 */
            --border-color: #cccccc;     /* 차분한 외곽선 */
            --bg-light: #fafafa;         /* 연한 회색 배경 */
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f5f5f5;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 800px;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        /* 프린트 및 상단 컨트롤 영역 (미니멀하게 배치) */
        .control-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .paste-zone {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
        }

        button {
            padding: 0 16px;
            height: 38px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #1b5e20; }
        .btn-secondary { background-color: #616161; color: white; }
        .btn-secondary:hover { background-color: #424242; }
        .btn-outline { background-color: white; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-outline:hover { background-color: var(--primary-light); }

        /* 원래 예뻤던 타이틀 스타일 */
        h1 {
            text-align: center;
            font-size: 26px;
            color: var(--primary-color);
            margin-top: 10px;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        /* 깔끔하고 컴팩트한 격자 테이블 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            height: 24px;
        }

        th {
            background-color: var(--primary-light);
            color: #1b5e20;
            font-weight: 600;
            text-align: center;
            width: 20%;
        }

        td {
            background-color: #ffffff;
            width: 30%;
        }

        /* 인풋 박스를 테이블 칸에 딱 맞게 무선처럼 보이도록 디자인 */
        input[type="text"], input[type="number"] {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-color);
            padding: 0;
            margin: 0;
            background: transparent;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .amount-input {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 25px 0 10px 0;
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
        }

        /* 인쇄할 때 상단 버튼들 싹 숨겨주는 깔끔한 인쇄 설정 */
        @media print {
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; padding: 10px; width: 100%; }
            .control-panel { display: none; }
            th { background-color: var(--primary-light) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 기능 제어 영역 (원래 디자인 해치지 않게 미니멀하게 한 줄 배치) -->
    <div class="control-panel">
        <div class="paste-zone">
            <textarea id="weHagoPaste" placeholder="여기에 위하고 텍스트(Ctrl+A 후 복사한 것)를 붙여넣으세요..."></textarea>
        </div>
        <button class="btn-primary" onclick="parseWeHago()">분석하기</button>
        <button class="btn-outline" onclick="saveData()">💾 저장</button>
        <button class="btn-secondary" onclick="window.print()">🖨️ PDF 출력</button>
    </div>

    <h1>종합소득세 신고 내역 요약</h1>

    <div class="section-title">기본 사항</div>
    <table>
        <tr>
            <th>성 명</th>
            <td><input type="text" id="name"></td>
            <th>귀속연도</th>
            <td><input type="text" id="year" value="2025년"></td>
        </tr>
        <tr>
            <th>주민등록번호</th>
            <td><input type="text" id="residentNo"></td>
            <th>휴대폰번호</th>
            <td><input type="text" id="phone"></td>
        </tr>
    </table>

    <div class="section-title">신고 내역 요약</div>
    <table>
        <tr>
            <th>총수입금액</th>
            <td><input type="text" id="totalIncome" class="amount-input" oninput="formatAndCalculate(this)"></td>
            <th>종합소득금액</th>
            <td><input type="text" id="bizIncome" class="amount-input" oninput="formatAndCalculate(this)"></td>
        </tr>
        <tr>
            <th>소득공제계</th>
            <td><input type="text" id="deductions" class="amount-input" oninput="formatAndCalculate(this)" value="1,500,000"></td>
            <th>과세표준</th>
            <td><input type="text" id="taxBase" class="amount-input" readonly style="font-weight:bold; color:#1b5e20;"></td>
        </tr>
        <tr>
            <th>산출세액</th>
            <td><input type="text" id="calculatedTax" class="amount-input" readonly></td>
            <th>세액공제 및 감면</th>
            <td><input type="text" id="taxCredits" class="amount-input" oninput="formatAndCalculate(this)" value="0"></td>
        </tr>
        <tr>
            <th>가산세액</th>
            <td><input type="text" id="penaltyTax" class="amount-input" oninput="formatAndCalculate(this)" value="0"></td>
            <th>기납부세액</th>
            <td><input type="text" id="prepaidTax" class="amount-input" oninput="formatAndCalculate(this)" value="0"></td>
        </tr>
        <tr style="background-color: var(--bg-light);">
            <th style="background-color: #c8e6c9; color: #1b5e20;">차감납부할 세액 (국세)</th>
            <td style="font-weight: bold; color: #d32f2f;"><input type="text" id="finalNationalTax" class="amount-input" readonly style="font-weight:bold; color:#d32f2f;"></td>
            <th style="background-color: #c8e6c9; color: #1b5e20;">지방소득세 (10%)</th>
            <td><input type="text" id="finalLocalTax" class="amount-input" readonly style="font-weight:bold; color:#d32f2f;"></td>
        </tr>
    </table>
</div>

<script>
    // 콤마 제거 및 숫자로 변환
    function unformatNumber(str) {
        return parseInt(str.replace(/,/g, '')) || 0;
    }

    // 콤마 추가
    function formatNumber(num) {
        return num.toLocaleString();
    }

    // 입력 시 실시간 콤마 포맷팅 및 세액 자동 계산
    function formatAndCalculate(input) {
        let num = unformatNumber(input.value);
        input.value = formatNumber(num);
        calculateTax();
    }

    // 실시간 세액 및 과표 계산 로직
    function calculateTax() {
        let bizIncome = unformatNumber(document.getElementById('bizIncome').value);
        let deductions = unformatNumber(document.getElementById('deductions').value);
        
        // 1. 과세표준 계산
        let taxBase = Math.max(0, bizIncome - deductions);
        document.getElementById('taxBase').value = formatNumber(taxBase);

        // 2. 2025/2026년 현행 소득세율 기본 적용 산출세액 계산
        let calcTax = 0;
        if (taxBase <= 14000000) { calcTax = taxBase * 0.06; }
        else if (taxBase <= 50000000) { calcTax = (taxBase * 0.15) - 1260000; }
        else if (taxBase <= 88000000) { calcTax = (taxBase * 0.24) - 5760000; }
        else if (taxBase <= 150000000) { calcTax = (taxBase * 0.35) - 15440000; }
        else if (taxBase <= 300000000) { calcTax = (taxBase * 0.38) - 19940000; }
        else if (taxBase <= 500000000) { calcTax = (taxBase * 0.40) - 25940000; }
        else if (taxBase <= 1000000000) { calcTax = (taxBase * 0.42) - 35940000; }
        else { calcTax = (taxBase * 0.45) - 65940000; }
        
        calcTax = Math.floor(calcTax);
        document.getElementById('calculatedTax').value = formatNumber(calcTax);

        // 3. 최종 납부세액 계산
        let taxCredits = unformatNumber(document.getElementById('taxCredits').value);
        let penaltyTax = unformatNumber(document.getElementById('penaltyTax').value);
        let prepaidTax = unformatNumber(document.getElementById('prepaidTax').value);

        let finalNational = calcTax - taxCredits + penaltyTax - prepaidTax;
        let finalLocal = Math.floor(finalNational * 0.1);

        document.getElementById('finalNationalTax').value = formatNumber(finalNational);
        document.getElementById('finalLocalTax').value = formatNumber(finalLocal);
    }

    // 위하고 텍스트 정규식 정밀 분석 패턴 복원
    function parseWeHago() {
        const text = document.getElementById('weHagoPaste').value;
        if(!text.trim()) { alert('붙여넣은 텍스트가 없습니다.'); return; }

        // 성명 매칭
        const nameMatch = text.match(/(?:성명|성 명)\s*[:\s]([가-힣]{2,5})/);
        if(nameMatch) document.getElementById('name').value = nameMatch[1].trim();

        // 주민번호 매칭
        const resMatch = text.match(/(\d{6}-\d{7})/);
        if(resMatch) document.getElementById('residentNo').value = resMatch[1];

        // 수입금액 매칭
        const incomeMatch = text.match(/(?:총수입금액|수입금액)\s*([\d,]+)/);
        if(incomeMatch) {
            document.getElementById('totalIncome').value = incomeMatch[1];
        }

        // 소득금액 매칭
        const bizMatch = text.match(/(?:종합소득금액|소득금액)\s*([\d,]+)/);
        if(bizMatch) {
            document.getElementById('bizIncome').value = bizMatch[1];
        }

        calculateTax();
        alert('위하고 데이터 분석이 완료되었습니다. 빈칸을 확인해 주세요!');
    }

    // 브라우저 임시 저장 (자동 세션 유지 복원)
    function saveData() {
        const fields = ['name', 'year', 'residentNo', 'phone', 'totalIncome', 'bizIncome', 'deductions', 'taxCredits', 'penaltyTax', 'prepaidTax'];
        fields.forEach(field => {
            localStorage.setItem('tax_' + field, document.getElementById(field).value);
        });
        alert('현재 입력된 내역이 브라우저에 안전하게 저장되었습니다.');
    }

    // 페이지 로드시 자동 데이터 불러오기 
    window.onload = function() {
        const fields = ['name', 'year', 'residentNo', 'phone', 'totalIncome', 'bizIncome', 'deductions', 'taxCredits', 'penaltyTax', 'prepaidTax'];
        fields.forEach(field => {
            const savedValue = localStorage.getItem('tax_' + field);
            if (savedValue !== null) {
                document.getElementById(field).value = savedValue;
            }
        });
        calculateTax();
    }
</script>
</body>
</html>

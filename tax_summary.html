<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합소득세 신고 내역 요약</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 40px; background: #fff; color: #333; line-height: 1.5; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #111; font-size: 28px; margin-bottom: 30px; letter-spacing: -1px; }
        
        /* 상단 툴바 */
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #333; }
        .btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; color: #333; border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn:hover { background: #f8f9fa; }
        
        .btn-upload { background: #2b8a3e; color: white; border: 1px solid #2b8a3e; }
        .btn-upload:hover { background: #237032; }
        .btn-save { background: #37b24d; color: white; border: 1px solid #37b24d; margin-left: 5px; }
        .btn-save:hover { background: #2f9e44; }
        .btn-print { background: #1c7ed6; color: white; border: 1px solid #1c7ed6; }
        .btn-print:hover { background: #1a6ca8; }
        
        .status-msg { font-size: 12px; color: #666; font-weight: bold; }
        
        /* 텍스트 붙여넣기 박스 */
        .paste-zone { display: none; margin-bottom: 25px; background: #f8f9fa; padding: 15px; border: 1px solid #ced4da; border-radius: 4px; }
        .paste-zone textarea { width: 98%; height: 100px; padding: 8px; border: 1px solid #ced4da; border-radius: 3px; font-size: 13px; resize: none; }
        .paste-zone-btn { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; }

        /* 기본 정보 서식 */
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .info-table td { border: 1px solid #dee2e6; padding: 12px; font-size: 14px; }
        .info-table td.label { background: #f8f9fa; font-weight: bold; width: 15%; text-align: center; }
        .info-table input { width: 90%; padding: 6px; border: 1px solid #ced4da; border-radius: 3px; font-size: 14px; }
        
        h3 { font-size: 18px; color: #111; margin: 30px 0 10px 0; border-left: 4px solid #2b8a3e; padding-left: 10px; }
        
        /* 테이블 스타일 */
        table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        table.data-table th, table.data-table td { border: 1px solid #dee2e6; padding: 10px; text-align: center; font-size: 14px; }
        table.data-table th { background: #f8f9fa; font-weight: bold; color: #495057; }
        table.data-table input { width: 90%; padding: 5px; border: 1px solid #ced4da; border-radius: 3px; text-align: center; }
        table.data-table input.text-right { text-align: right; }
        
        .btn-add { background: #e9ecef; border: 1px solid #ced4da; color: #495057; padding: 5px 12px; font-size: 13px; border-radius: 3px; cursor: pointer; margin-bottom: 20px; }
        .btn-add:hover { background: #dee2e6; }
        
        /* 세액 계산 명세 */
        .tax-calc-table { width: 100%; border-collapse: collapse; }
        .tax-calc-table td { border: 1px solid #dee2e6; padding: 12px; font-size: 14px; }
        .tax-calc-table td.label { background: #f8f9fa; font-weight: bold; width: 40%; padding-left: 20px; }
        .tax-calc-table input { width: 150px; padding: 6px; border: 1px solid #ced4da; border-radius: 3px; text-align: right; font-size: 14px; }
        .tax-calc-table .result-val { font-weight: bold; text-align: right; padding-right: 15px; }
        
        .highlight-row { background: #f4fbf7; font-weight: bold; }
        .total-row { background: #ebfbee; color: #2b8a3e; font-weight: bold; font-size: 16px; }
        .total-row .result-val { font-size: 18px; }

        @media print {
            body { margin: 0; background: white; }
            .action-bar, .btn-add, .paste-zone { display: none !important; }
            .container { width: 100%; }
            input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>종합소득세 신고 내역 요약</h1>
    
    <!-- 상단 툴바 -->
    <div class="action-bar">
        <div>
            <button class="btn btn-upload" onclick="togglePasteZone()">📋 위하고 텍스트 붙여넣기</button>
            <button class="btn btn-save" onclick="saveToLocal()">💾 데이터 저장</button>
        </div>
        <div class="status-msg" id="statusMsg">위하고 데이터를 복사해 붙여넣거나 직접 입력하세요.</div>
        <button class="btn btn-print" onclick="window.print()">🖨️ 인쇄 / PDF 출력</button>
    </div>

    <!-- 텍스트 붙여넣기 영역 (기본 숨김) -->
    <div class="paste-zone" id="pasteZone">
        <textarea id="rawText" placeholder="위하고 PDF를 열고 전체 선택(Ctrl+A) -> 복사(Ctrl+C)한 내용을 여기에 붙여넣기(Ctrl+V) 하세요."></textarea>
        <div class="paste-zone-btn">
            <button class="btn" style="background:#6c757d; color:#fff;" onclick="togglePasteZone()">취소</button>
            <button class="btn" style="background:#2b8a3e; color:#fff;" onclick="parsePastedText()">데이터 분석하기</button>
        </div>
    </div>

    <!-- 기본 정보 서식 -->
    <table class="info-table">
        <tr>
            <td class="label">귀속연도</td>
            <td><input type="text" id="taxYear" placeholder="2025"></td>
            <td class="label">성명 (상호)</td>
            <td><input type="text" id="taxpayerName" placeholder="홍길동"></td>
            <td class="label">납부기한</td>
            <td><input type="text" id="dueDate" value="2026. 06. 02"></td>
        </tr>
    </table>

    <!-- 1. 사업장별 명세 -->
    <h3>1. 사업장별 수입금액 및 소득금액</h3>
    <button class="btn-add" onclick="addBusinessRow()">＋ 사업장 추가</button>
    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 25%;">상호(사업장명)</th>
                <th style="width: 20%;">사업자등록번호</th>
                <th style="width: 20%;">총수입금액(매출)</th>
                <th style="width: 15%;">필요경비</th>
                <th style="width: 20%;">소득금액</th>
            </tr>
        </thead>
        <tbody id="businessBody">
            <!-- 행 동적 생성 -->
        </tbody>
    </table>

    <!-- 2. 세액 계산 명세 -->
    <h3>2. 세액 계산 명세 요약</h3>
    <table class="tax-calc-table">
        <tr>
            <td class="label">① 종합소득금액 (사업소득 + 타소득)</td>
            <td class="text-right"><input type="text" id="totalIncomeAmt" value="0" oninput="calculateTax()"></td>
        </tr>
        <tr>
            <td class="label">② 소득공제 합계 (인적공제 등)</td>
            <td class="text-right"><input type="text" id="taxDeduction" value="0" oninput="calculateTax()"></td>
        </tr>
        <tr class="highlight-row">
            <td class="label">③ 과세표준 (① - ②)</td>
            <td class="result-val" id="taxBase">0</td>
        </tr>
        <tr>
            <td class="label">④ 세율 (%)</td>
            <td class="result-val" id="taxRate">0%</td>
        </tr>
        <tr>
            <td class="label">⑤ 산출세액 (③ × ④ - 누진공제)</td>
            <td class="result-val" id="calculatedTax">0</td>
        </tr>
        <tr>
            <td class="label">⑥ 세액공제 및 감면 합계</td>
            <td class="text-right"><input type="text" id="taxCredit" value="0" oninput="calculateTax()"></td>
        </tr>
        <tr class="total-row">
            <td class="label">⑦ 최종 납부(환급)할 세액 (⑤ - ⑥)</td>
            <td class="result-val" id="finalTax">0 원</td>
        </tr>
    </table>
</div>

<script>
    window.onload = function() {
        loadFromLocal();
        if(document.getElementById('businessBody').children.length === 0) {
            addBusinessRow();
        }
    };

    function togglePasteZone() {
        const zone = document.getElementById('pasteZone');
        zone.style.display = zone.style.display === 'block' ? 'none' : 'block';
    }

    function addBusinessRow(name='', num='', income='0', expense='0', net='0') {
        const tbody = document.getElementById('businessBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" value="${name}"></td>
            <td><input type="text" value="${num}"></td>
            <td><input type="text" class="text-right b-income" value="${formatNum(income)}" oninput="updateRowCalc(this)"></td>
            <td><input type="text" class="text-right b-expense" value="${formatNum(expense)}" oninput="updateRowCalc(this)"></td>
            <td><input type="text" class="text-right b-net" value="${formatNum(net)}" readonly style="background:#f8f9fa; border:none;"></td>
        `;
        tbody.appendChild(tr);
    }

    function formatNum(val) {
        val = String(val).replace(/[^0-9-]/g, '');
        if(!val) return '0';
        return Number(val).toLocaleString();
    }
    function parseNum(val) {
        return Number(String(val).replace(/,/g, '')) || 0;
    }

    function updateRowCalc(input) {
        input.value = formatNum(input.value);
        const tr = input.closest('tr');
        const income = parseNum(tr.querySelector('.b-income').value);
        const expense = parseNum(tr.querySelector('.b-expense').value);
        tr.querySelector('.b-net').value = formatNum(income - expense);
        updateTotalIncomeFromTable();
    }

    function updateTotalIncomeFromTable() {
        let sum = 0;
        document.querySelectorAll('.b-net').forEach(el => {
            sum += parseNum(el.value);
        });
        document.getElementById('totalIncomeAmt').value = formatNum(sum);
        calculateTax();
    }

    function calculateTax() {
        const totalIncome = parseNum(document.getElementById('totalIncomeAmt').value);
        const deduction = parseNum(document.getElementById('taxDeduction').value);
        
        let base = totalIncome - deduction;
        if (base < 0) base = 0;
        document.getElementById('taxBase').innerText = formatNum(base);

        let rate = 6; let cumDeduction = 0;
        if (base <= 14000000) { rate = 6; cumDeduction = 0; }
        else if (base <= 50000000) { rate = 15; cumDeduction = 1260000; }
        else if (base <= 88000000) { rate = 24; cumDeduction = 5760000; }
        else if (base <= 150000000) { rate = 35; cumDeduction = 15440000; }
        else if (base <= 300000000) { rate = 38; cumDeduction = 19940000; }
        else if (base <= 500000000) { rate = 40; cumDeduction = 25940000; }
        else if (base <= 1000000000) { rate = 42; cumDeduction = 35940000; }
        else { rate = 45; cumDeduction = 65940000; }

        document.getElementById('taxRate').innerText = rate + '%';
        let calcTax = Math.floor(base * (rate / 100) - cumDeduction);
        if (calcTax < 0) calcTax = 0;
        document.getElementById('calculatedTax').innerText = formatNum(calcTax);

        const credit = parseNum(document.getElementById('taxCredit').value);
        let final = calcTax - credit;
        document.getElementById('finalTax').innerText = formatNum(final) + ' 원';
    }

    // 💡 [핵심] 복사 붙여넣기 텍스트 유연하게 가공하기
    function parsePastedText() {
        const text = document.getElementById('rawText').value;
        if(!text.trim()) {
            alert("텍스트를 입력해 주세요.");
            return;
        }

        // 1. 성명 및 연도 유추
        const nameMatch = text.match(/(?:성명|성 명|성\s+명)\s*[:\s]([가-힣\s]{2,5})\s/) || text.match(/([가-힣]{2,4})\s*(?:귀하|고객)/);
        if(nameMatch) document.getElementById('taxpayerName').value = nameMatch[1].trim();

        const yearMatch = text.match(/(202\d)년도/) || text.match(/(202\d)\s*귀속/);
        if(yearMatch) document.getElementById('taxYear').value = yearMatch[1];

        // 2. 텍스트 안에서 큰 숫자 배열을 순서대로 추적 (매출액 -> 소득금액 유추용)
        // 위하고를 긁으면 보통 큰 숫자(매출)가 먼저 나오고 소득금액, 공제액 순으로 나열됩니다.
        const numbers = text.match(/\b[\d,]{5,13}\b/g); 
        
        let income = "0";
        let netIncome = "0";
        let deduction = "0";
        let credit = "0";

        if(numbers && numbers.length >= 2) {
            // 가장 큰 숫자를 수입금액, 그 다음을 소득금액으로 유연하게 임시 지정
            let sortedNums = [...numbers].map(n => parseNum(n)).sort((a,b) => b-a);
            income = formatNum(sortedNums[0]);
            netIncome = formatNum(sortedNums[1]);
            if(sortedNums[2]) deduction = formatNum(sortedNums[sortedNums.length - 1]); // 가장 작은 숫자를 공제나 감면으로 유추
        }

        // 상호 및 사업자번호 매칭
        const bizNameMatch = text.match(/(?:상호|상 호)\s*[:\s]([가-힣a-zA-Z0-9\s]+?)\s/);
        const bizNumMatch = text.match(/[0-9]{3}-[0-9]{2}-[0-9]{5}/);
        let bizName = bizNameMatch ? bizNameMatch[1].trim() : "주요 사업장";
        let bizNum = bizNumMatch ? bizNumMatch[0] : "";

        // 테이블 리셋 후 반영
        const tbody = document.getElementById('businessBody');
        tbody.innerHTML = '';
        
        let expense = formatNum(parseNum(income) - parseNum(netIncome));
        addBusinessRow(bizName, bizNum, income, expense, netIncome);

        document.getElementById('taxDeduction').value = deduction;
        
        updateTotalIncomeFromTable();
        togglePasteZone(); // 입력창 닫기
        document.getElementById('statusMsg').innerText = "텍스트 붙여넣기 분석 완료! 빈 칸을 보완해 주세요.";
    }

    function saveToLocal() {
        const data = {
            taxYear: document.getElementById('taxYear').value,
            taxpayerName: document.getElementById('taxpayerName').value,
            dueDate: document.getElementById('dueDate').value,
            totalIncomeAmt: document.getElementById('totalIncomeAmt').value,
            taxDeduction: document.getElementById('taxDeduction').value,
            taxCredit: document.getElementById('taxCredit').value,
            businesses: []
        };
        const rows = document.getElementById('businessBody').children;
        for(let tr of rows) {
            const inputs = tr.querySelectorAll('input');
            if(inputs.length >= 5) {
                data.businesses.push({
                    name: inputs[0].value, num: inputs[1].value, income: inputs[2].value, expense: inputs[3].value, net: inputs[4].value
                });
            }
        }
        localStorage.setItem('tax_summary_data', JSON.stringify(data));
        document.getElementById('statusMsg').innerText = "장부에 성공적으로 저장되었습니다.";
        alert("현재 입력한 내역이 안전하게 보관되었습니다.");
    }

    function loadFromLocal() {
        const saved = localStorage.getItem('tax_summary_data');
        if(!saved) return;
        const data = JSON.parse(saved);
        document.getElementById('taxYear').value = data.taxYear || '';
        document.getElementById('taxpayerName').value = data.taxpayerName || '';
        document.getElementById('dueDate').value = data.dueDate || '';
        document.getElementById('totalIncomeAmt').value = data.totalIncomeAmt || '0';
        document.getElementById('taxDeduction').value = data.taxDeduction || '0';
        document.getElementById('taxCredit').value = data.taxCredit || '0';

        const tbody = document.getElementById('businessBody');
        tbody.innerHTML = '';
        if(data.businesses && data.businesses.length > 0) {
            data.businesses.forEach(b => {
                addBusinessRow(b.name, b.num, b.income, b.expense, b.net);
            });
        }
        calculateTax();
        document.getElementById('statusMsg').innerText = "이전 저장 내역을 성공적으로 복구했습니다.";
    }
</script>
</body>
</html>
